# The manifest the README payload is read from.
#
# Everything the rendered README quotes about this project — the coordinates, the version, the JDK
# and the Gradle floor — is read from here by the readme-variables action, so a value edited here
# reaches the README in the commit that edits it. Gradle itself applies `group`, `version` and
# `description` to the project, so the build script no longer declares any of them.

group=de.timscho
artifactId=gradle-jextract
# The id this build registers with the plugin portal. Read by the build script and by the README
# payload step, so the two cannot disagree.
pluginId=de.timscho.jextract
description=Gradle plugin that downloads jextract and generates Java FFM bindings, with optional bundled library loading.
license=Apache-2.0

# The toolchain the build compiles against, and the Gradle version the plugin declares support from.
javaVersion=25
gradleVersion=9.0

# x-release-please-start-version
version=0.3.19
# x-release-please-end
