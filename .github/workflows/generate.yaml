name: Generate

# Every file a tool writes rather than a person. Each generator job runs on the pull request's head
# and uploads a patch; the Generated Files job is the required check and fails while a patch is not
# committed yet or a generator failed. generate-commit.yaml, a workflow_run workflow the pull request
# cannot edit, commits the merged patch to the branch, and the run on that commit decides.
#
# Spotless and OpenRewrite run through ./gradlew, so on a pull request they run that pull request's
# wrapper, build script and plugins. The generator jobs therefore hold no secret and no write
# permission and hand on only a patch; the App key lives in generate-commit.yaml, which runs nothing
# from the checkout.
#
# No `paths` filter: the Generated Files check has to report on every pull request to be required.

on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Renders README.md from its template and hands the result on as a patch.
  readme:
    name: Render README
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read # to read code
    outputs:
      has_changes: ${{ steps.patch.outputs.has_changes }}
      artifact_name: ${{ steps.patch.outputs.artifact_name }}
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit

      # The pull request head, not the merge commit: the patch is committed to the branch, so it has
      # to be computed against the commit the branch points at.
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha }}

      # The half of the payload readme-variables cannot derive: the plugin id this build registers
      # and the jextract build it defaults to. Both are read straight out of the files that hold
      # them rather than through Gradle, because a build that cannot configure would otherwise
      # leave this step green with an empty payload and surface as a strict-mode error in the
      # render, three steps away from the cause. Each value is its own assignment so `set -e`
      # sees a failure; a `$(...)` inside `echo` would not fail the step.
      - name: Generate the configuration payload
        id: config
        run: |
          set -euo pipefail
          property() { sed -n "s/^$1=//p" gradle.properties | head -n 1; }
          license="$(property license)"
          plugin_id="$(property pluginId)"
          tool_version="$(tr -d "[:space:]" < gradle/jextract-version)"
          json="$(jq -nc --arg license "$license" --arg pluginId "$plugin_id" --arg toolVersion "$tool_version" '{repo:{license:$license},plugin:{id:$pluginId,tool_version:$toolVersion}}')"
          echo "json=${json}" >> "$GITHUB_OUTPUT"

      - name: Collect the README payload
        id: variables
        uses: TimSchoenle/actions/actions/common/readme-variables@7c1147cf1e275c068a8484fa9a2dcb38a8b1f92f # tag=actions-common-readme-variables-v2.1.4
        with:
          branch: ${{ github.event.repository.default_branch }}
          extra: ${{ steps.config.outputs.json }}

      - name: Render the README
        uses: TimSchoenle/actions/actions/common/render-template@7c1147cf1e275c068a8484fa9a2dcb38a8b1f92f # tag=actions-common-render-template-v3.0.4
        with:
          template: .github/templates/README.md.hbs
          output: README.md
          variables: ${{ steps.variables.outputs.variables }}

      - name: Create Patch
        id: patch
        uses: TimSchoenle/actions/actions/common/create-patch@b37134ffa35b3ce98437447e3b4c76933eb65c04 # tag=actions-common-create-patch-v1.1.2
        with:
          artifact_name: readme-render
          paths: README.md

  # Runs `rewriteAndFormat` and hands on what it changed as a patch.
  auto-format:
    name: Auto-Format
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read # to read code
    outputs:
      has_changes: ${{ steps.spotless.outputs.changes_detected }}
      artifact_name: ${{ steps.spotless.outputs.artifact_name }}
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Auto-Format Code
        id: spotless
        uses: TimSchoenle/actions/actions/java-gradle/auto-spotless@6a49261c7bbd756b4ceca9b1c168dfc7dc095e64 # tag=actions-java-gradle-auto-spotless-v2.0.3
        with:
          java_version: '25'
          gradle_spotless_command: 'rewriteAndFormat'
          artifact_name: auto-spotless

  # The required check. It needs every generator above and runs whatever their result, so it
  # reports on every pull request.
  verdict:
    name: Generated Files
    needs: [ readme, auto-format ]
    if: always() && github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read # to check out the commit the merged patch is made from
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: block
          allowed-endpoints: >
            github.com:443
            api.github.com:443
            *.actions.githubusercontent.com:443
            *.blob.core.windows.net:443

      - name: Generated Files Verdict
        uses: TimSchoenle/actions/actions/common/generated-files-verdict@7c1147cf1e275c068a8484fa9a2dcb38a8b1f92f # tag=actions-common-generated-files-verdict-v1.2.3
        with:
          needs: ${{ toJSON(needs) }}

  # The drift gate on the default branch. Renders without writing and fails when the committed
  # README.md differs, which is what makes the template the source rather than a suggestion.
  verify:
    name: readme
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read # to read code
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      # The same payload as the readme job above; any difference would pass a stale file.
      - name: Generate the configuration payload
        id: config
        run: |
          set -euo pipefail
          property() { sed -n "s/^$1=//p" gradle.properties | head -n 1; }
          license="$(property license)"
          plugin_id="$(property pluginId)"
          tool_version="$(tr -d "[:space:]" < gradle/jextract-version)"
          json="$(jq -nc --arg license "$license" --arg pluginId "$plugin_id" --arg toolVersion "$tool_version" '{repo:{license:$license},plugin:{id:$pluginId,tool_version:$toolVersion}}')"
          echo "json=${json}" >> "$GITHUB_OUTPUT"

      - name: Collect the README payload
        id: variables
        uses: TimSchoenle/actions/actions/common/readme-variables@7c1147cf1e275c068a8484fa9a2dcb38a8b1f92f # tag=actions-common-readme-variables-v2.1.4
        with:
          branch: ${{ github.event.repository.default_branch }}
          extra: ${{ steps.config.outputs.json }}

      - name: Verify README.md is current
        uses: TimSchoenle/actions/actions/common/render-template@7c1147cf1e275c068a8484fa9a2dcb38a8b1f92f # tag=actions-common-render-template-v3.0.4
        with:
          template: .github/templates/README.md.hbs
          output: README.md
          variables: ${{ steps.variables.outputs.variables }}
          check: 'true'
