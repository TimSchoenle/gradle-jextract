name: Build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: { }

jobs:
  checkstyle:
    name: CheckStyle
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read # to read code
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Setup Base Environment
        uses: $/.github/actions/setup-base-environment

      - name: Checkstyle
        run: ./gradlew checkstyleMain

  build:
    name: Build(Without Test)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: checkstyle
    permissions:
      contents: read # to read code
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Setup Base Environment
        uses: $/.github/actions/setup-base-environment

      - name: Build without test
        run: ./gradlew build -x test -x functionalTest

  test:
    name: Test
    needs: build
    strategy:
      matrix:
        os: [ ubuntu-latest, windows-latest, macos-latest ]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    permissions:
      contents: read # to fetch code
      checks: write # for action-junit-report to publish the test report as a check run
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Setup Base Environment
        uses: $/.github/actions/setup-base-environment

      - name: Test
        run: ./gradlew test

      - name: Publish Test Report
        uses: mikepenz/action-junit-report@8a133bfa3ecb0ea9024c1e2ae788b4c25f6cdb9d # v6.6.2
        if: success() || failure()
        with:
          report_paths: '**/build/test-results/test/TEST-*.xml'
          require_tests: true

  # Kept apart from `test`, so a Codecov outage fails this job alone. The upload authenticates
  # with this job's OIDC token, so the job needs no environment and no secret.
  # `.github/codecov.yml` decides what the Codecov statuses check. Every Test task runs here,
  # `functionalTest` included, which `test` above leaves out.
  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read # Required to checkout the code
      id-token: write # Required to authenticate the Codecov upload with OIDC
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit

      - name: Run Coverage
        uses: TimSchoenle/actions/actions/java-gradle/coverage-codecov@e4229b81c3c3c880b9561dc4d53bd87ccf49eaf3 # tag=actions-java-gradle-coverage-codecov-v1.1.4
        with:
          java_version: '25'
          flags: java
