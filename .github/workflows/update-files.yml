name: Update Files

on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Renders README.md from its template and commits the result back to the pull request. An
  # unchanged render produces no commit. A fork's pull request gets no bot token, so it is verified
  # by the job below instead.
  update-readme:
    environment:
      name: ci
      deployment: false
    name: Update README
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    outputs:
      changes_detected: ${{ steps.auto-commit.outputs.changes_detected }}
    permissions:
      contents: write # to push readme changes
      pull-requests: write # to comment on PRs
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit

      - name: Generate Bot Token
        id: generate_token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: ${{ secrets.ACTIONS_MAINTENANCE_APP_ID }}
          private-key: ${{ secrets.ACTIONS_MAINTENANCE_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ github.head_ref }}
          token: ${{ steps.generate_token.outputs.token }}

      # The half of the payload readme-variables cannot derive: the plugin id this build registers
      # and the jextract build it defaults to. Both are read straight out of the files that hold
      # them rather than through Gradle, because a build that cannot configure would otherwise
      # leave this step green with an empty payload and surface as a strict-mode error in the
      # render, three steps away from the cause. Each value is its own assignment so `set -e`
      # sees a failure; a `$(...)` inside `echo` would not fail the step.
      - name: Generate the configuration payload
        id: config
        run: |
          set -euo pipefail
          property() { sed -n "s/^$1=//p" gradle.properties | head -n 1; }
          license="$(property license)"
          plugin_id="$(property pluginId)"
          tool_version="$(tr -d "[:space:]" < gradle/jextract-version)"
          json="$(jq -nc --arg license "$license" --arg pluginId "$plugin_id" --arg toolVersion "$tool_version" '{repo:{license:$license},plugin:{id:$pluginId,tool_version:$toolVersion}}')"
          echo "json=${json}" >> "$GITHUB_OUTPUT"

      - name: Collect the README payload
        id: variables
        uses: TimSchoenle/actions/actions/common/readme-variables@8da2713994ba2b5f542e7e3334db287b1e22854a # tag=actions-common-readme-variables-v1.2.9
        with:
          branch: ${{ github.event.repository.default_branch }}
          extra: ${{ steps.config.outputs.json }}

      - name: Render and commit the README
        id: auto-commit
        uses: TimSchoenle/actions/actions/common/render-template-and-commit@ea4465fbe2bec98efad19b63849f8d1ac67b5c88 # tag=actions-common-render-template-and-commit-v1.1.18
        with:
          template: .github/templates/README.md.hbs
          output: README.md
          variables: ${{ steps.variables.outputs.variables }}
          token: ${{ steps.generate_token.outputs.token }}
          commit_message: 'docs: render README from its template'

      # Upserted under one identifier, so a pull request that re-renders the README on several
      # pushes carries one comment rather than one per push.
      - name: Comment on PR
        if: steps.auto-commit.outputs.changes_detected == 'true'
        uses: TimSchoenle/actions/actions/common/upsert-pr-comment@9414b1c665d3676efe832978d4e1728cf53119fd # tag=actions-common-upsert-pr-comment-v1.3.0
        with:
          token: ${{ steps.generate_token.outputs.token }}
          identifier: readme-render
          body: '`README.md` has been re-rendered from `.github/templates/README.md.hbs`.'

  # The drift gate. Renders without writing and fails when the committed README.md differs, which is
  # what makes the template the source rather than a suggestion.
  verify:
    name: readme
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: read # to read code
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      # The half of the payload readme-variables cannot derive: the plugin id this build registers
      # and the jextract build it defaults to. Both are read straight out of the files that hold
      # them rather than through Gradle, because a build that cannot configure would otherwise
      # leave this step green with an empty payload and surface as a strict-mode error in the
      # render, three steps away from the cause. Each value is its own assignment so `set -e`
      # sees a failure; a `$(...)` inside `echo` would not fail the step.
      - name: Generate the configuration payload
        id: config
        run: |
          set -euo pipefail
          property() { sed -n "s/^$1=//p" gradle.properties | head -n 1; }
          license="$(property license)"
          plugin_id="$(property pluginId)"
          tool_version="$(tr -d "[:space:]" < gradle/jextract-version)"
          json="$(jq -nc --arg license "$license" --arg pluginId "$plugin_id" --arg toolVersion "$tool_version" '{repo:{license:$license},plugin:{id:$pluginId,tool_version:$toolVersion}}')"
          echo "json=${json}" >> "$GITHUB_OUTPUT"

      - name: Collect the README payload
        id: variables
        uses: TimSchoenle/actions/actions/common/readme-variables@8da2713994ba2b5f542e7e3334db287b1e22854a # tag=actions-common-readme-variables-v1.2.9
        with:
          branch: ${{ github.event.repository.default_branch }}
          extra: ${{ steps.config.outputs.json }}

      - name: Verify README.md is current
        uses: TimSchoenle/actions/actions/common/render-template@8da2713994ba2b5f542e7e3334db287b1e22854a # tag=actions-common-render-template-v1.2.9
        with:
          template: .github/templates/README.md.hbs
          output: README.md
          variables: ${{ steps.variables.outputs.variables }}
          check: 'true'

  # Spotless and OpenRewrite run through ./gradlew, so on a pull request they run that pull
  # request's wrapper, build script and plugins. Code running in a job can read every credential
  # that job holds, so the work is split in two: auto-format runs `rewriteAndFormat` with no secret,
  # no environment and no write permission, and only uploads what it changed as a patch artifact;
  # commit-format mints the App token and commits that patch with common/commit-patch. It runs no
  # repository code: it checks out the head for git's objects only, and commit-patch refuses any
  # path outside allowed_paths.
  auto-format:
    name: Auto-Format
    needs: update-readme
    if: github.event_name == 'pull_request' && needs.update-readme.outputs.changes_detected == 'false'
    runs-on: ubuntu-latest
    outputs:
      changes_detected: ${{ steps.spotless.outputs.changes_detected }}
    permissions:
      contents: read # to read code
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit

      # The pull request head, not the merge commit: the patch is committed to the branch, so it has
      # to be computed against the commit the branch points at.
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Auto-Format Code
        id: spotless
        uses: TimSchoenle/actions/actions/java-gradle/auto-spotless@495fd50fd4a5ae3d9fb1496c96eada74c6f2529a # tag=actions-java-gradle-auto-spotless-v2.0.0
        with:
          java_version: '25'
          gradle_spotless_command: 'rewriteAndFormat'
          artifact_name: auto-spotless

  commit-format:
    environment:
      name: ci
      deployment: false
    name: Commit Auto-Format
    needs: auto-format
    # A fork's pull request gets no secrets, and its branch is not in this repository.
    if: >-
      github.event_name == 'pull_request' &&
      needs.auto-format.outputs.changes_detected == 'true' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: read # to fetch the commit the patch applies to
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit

      # Only git's objects are needed. Nothing in this checkout is executed.
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha }}

      # Scoped to what this job does; without a `permission-*` input the token would inherit the
      # whole installation.
      - name: Generate Bot Token
        id: generate_token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: ${{ secrets.ACTIONS_MAINTENANCE_APP_ID }}
          private-key: ${{ secrets.ACTIONS_MAINTENANCE_PRIVATE_KEY }}
          permission-contents: write # to commit the formatted files
          permission-pull-requests: write # to comment on the pull request

      # The artifact name is a literal on purpose: the auto-format job's outputs come from pull
      # request code. Both halves of `rewriteAndFormat` only touch Java sources: the spotless block
      # formats `java` alone, and the de.timscho.rewrite.Style recipe is Java static analysis.
      - name: Commit Patch
        id: commit
        uses: TimSchoenle/actions/actions/common/commit-patch@bbc2c5e2a0f9345cb2e84946846736f047a6eae3 # tag=actions-common-commit-patch-v1.1.0
        with:
          token: ${{ steps.generate_token.outputs.token }}
          artifact_name: auto-spotless
          allowed_paths: 'src/**/*.java'
          commit_message: 'style: apply spotless formatting'

      # The comment auto-spotless v1 posted itself.
      - name: Comment on PR
        if: steps.commit.outputs.changes_committed == 'true'
        uses: TimSchoenle/actions/actions/common/upsert-pr-comment@495fd50fd4a5ae3d9fb1496c96eada74c6f2529a # tag=actions-common-upsert-pr-comment-v2.0.0
        with:
          token: ${{ steps.generate_token.outputs.token }}
          identifier: 'java-gradle-auto-spotless'
          # Only this App's own comment is updated; a pasted marker cannot redirect the edit.
          author: '${{ steps.generate_token.outputs.app-slug }}[bot]'
          body: 'Applied spotless formatting.'
