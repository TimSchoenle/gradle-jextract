name: Update Files

on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Renders README.md from its template and commits the result back to the pull request. An
  # unchanged render produces no commit. A fork's pull request gets no bot token, so it is verified
  # by the job below instead.
  update-readme:
    environment:
      name: ci
      deployment: false
    name: Update README
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    outputs:
      changes_detected: ${{ steps.auto-commit.outputs.changes_detected }}
    permissions:
      contents: write # to push readme changes
      pull-requests: write # to comment on PRs
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit

      - name: Generate Bot Token
        id: generate_token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.ACTIONS_MAINTENANCE_APP_ID }}
          private-key: ${{ secrets.ACTIONS_MAINTENANCE_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ github.head_ref }}
          token: ${{ steps.generate_token.outputs.token }}

      # The half of the payload readme-variables cannot derive: the plugin id this build registers
      # and the jextract build it defaults to. Both are read straight out of the files that hold
      # them rather than through Gradle, because a build that cannot configure would otherwise
      # leave this step green with an empty payload and surface as a strict-mode error in the
      # render, three steps away from the cause. Each value is its own assignment so `set -e`
      # sees a failure; a `$(...)` inside `echo` would not fail the step.
      - name: Generate the configuration payload
        id: config
        run: |
          set -euo pipefail
          property() { sed -n "s/^$1=//p" gradle.properties | head -n 1; }
          license="$(property license)"
          plugin_id="$(property pluginId)"
          tool_version="$(tr -d "[:space:]" < gradle/jextract-version)"
          json="$(jq -nc --arg license "$license" --arg pluginId "$plugin_id" --arg toolVersion "$tool_version" '{repo:{license:$license},plugin:{id:$pluginId,tool_version:$toolVersion}}')"
          echo "json=${json}" >> "$GITHUB_OUTPUT"

      - name: Collect the README payload
        id: variables
        uses: TimSchoenle/actions/actions/common/readme-variables@b5b5c9e047f00ffa00b7772536c8bdb4f158f706 # tag=actions-common-readme-variables-v1.1.0
        with:
          branch: ${{ github.event.repository.default_branch }}
          extra: ${{ steps.config.outputs.json }}

      - name: Render and commit the README
        id: auto-commit
        uses: TimSchoenle/actions/actions/common/render-template-and-commit@15d83f02081c9dc8a844646199c63792dcccdfa8 # tag=actions-common-render-template-and-commit-v1.1.3
        with:
          template: .github/templates/README.md.hbs
          output: README.md
          variables: ${{ steps.variables.outputs.variables }}
          token: ${{ steps.generate_token.outputs.token }}
          commit_message: 'docs: render README from its template'

      - name: Comment on PR
        if: steps.auto-commit.outputs.changes_detected == 'true'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        with:
          github-token: ${{ steps.generate_token.outputs.token }}
          script: |
            github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: '`README.md` has been re-rendered from `.github/templates/README.md.hbs`.'
            })

  # The drift gate. Renders without writing and fails when the committed README.md differs, which is
  # what makes the template the source rather than a suggestion.
  verify:
    name: readme
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: read # to read code
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      # The half of the payload readme-variables cannot derive: the plugin id this build registers
      # and the jextract build it defaults to. Both are read straight out of the files that hold
      # them rather than through Gradle, because a build that cannot configure would otherwise
      # leave this step green with an empty payload and surface as a strict-mode error in the
      # render, three steps away from the cause. Each value is its own assignment so `set -e`
      # sees a failure; a `$(...)` inside `echo` would not fail the step.
      - name: Generate the configuration payload
        id: config
        run: |
          set -euo pipefail
          property() { sed -n "s/^$1=//p" gradle.properties | head -n 1; }
          license="$(property license)"
          plugin_id="$(property pluginId)"
          tool_version="$(tr -d "[:space:]" < gradle/jextract-version)"
          json="$(jq -nc --arg license "$license" --arg pluginId "$plugin_id" --arg toolVersion "$tool_version" '{repo:{license:$license},plugin:{id:$pluginId,tool_version:$toolVersion}}')"
          echo "json=${json}" >> "$GITHUB_OUTPUT"

      - name: Collect the README payload
        id: variables
        uses: TimSchoenle/actions/actions/common/readme-variables@b5b5c9e047f00ffa00b7772536c8bdb4f158f706 # tag=actions-common-readme-variables-v1.1.0
        with:
          branch: ${{ github.event.repository.default_branch }}
          extra: ${{ steps.config.outputs.json }}

      - name: Verify README.md is current
        uses: TimSchoenle/actions/actions/common/render-template@3b7d152374ee63e720e7c16bed8b088b40554911 # tag=actions-common-render-template-v1.1.1
        with:
          template: .github/templates/README.md.hbs
          output: README.md
          variables: ${{ steps.variables.outputs.variables }}
          check: 'true'

  auto-format:
    environment:
      name: ci
      deployment: false
    name: Auto-Format
    needs: update-readme
    if: github.event_name == 'pull_request' && needs.update-readme.outputs.changes_detected == 'false'
    runs-on: ubuntu-latest
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit

      - name: Auto-Format Code
        uses: TimSchoenle/actions/actions/java-gradle/auto-spotless@84fb33691fb190da99c4a84c4bf56737f12bb972 # tag=actions-java-gradle-auto-spotless-v1.1.16
        with:
          java_version: '25'
          gradle_spotless_command: 'rewriteAndFormat'
          bot_private_key: ${{ secrets.ACTIONS_MAINTENANCE_PRIVATE_KEY }}
          bot_app_id: ${{ secrets.ACTIONS_MAINTENANCE_APP_ID }}
