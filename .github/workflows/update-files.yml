name: Update Files

on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Renders README.md from its template on a pull request and hands the result on as a patch, which
  # `readme-commit` in update-files-commit.yml (a workflow_run workflow the pull request cannot
  # edit) commits. An unchanged render produces no commit. A fork's pull request has no branch here
  # to commit to, so it is verified by the job below instead.
  #
  # This job is a required check, so it fails while its render is uncommitted: the head it ran on
  # is not the one to merge, and the run on the commit decides instead.
  update-readme:
    name: Update README
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      changes_detected: ${{ steps.patch.outputs.has_changes }}
    permissions:
      contents: read # to read code
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit

      # The pull request head, not the merge commit: the patch is committed to the branch, so it has
      # to be computed against the commit the branch points at.
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha }}

      # The half of the payload readme-variables cannot derive: the plugin id this build registers
      # and the jextract build it defaults to. Both are read straight out of the files that hold
      # them rather than through Gradle, because a build that cannot configure would otherwise
      # leave this step green with an empty payload and surface as a strict-mode error in the
      # render, three steps away from the cause. Each value is its own assignment so `set -e`
      # sees a failure; a `$(...)` inside `echo` would not fail the step.
      - name: Generate the configuration payload
        id: config
        run: |
          set -euo pipefail
          property() { sed -n "s/^$1=//p" gradle.properties | head -n 1; }
          license="$(property license)"
          plugin_id="$(property pluginId)"
          tool_version="$(tr -d "[:space:]" < gradle/jextract-version)"
          json="$(jq -nc --arg license "$license" --arg pluginId "$plugin_id" --arg toolVersion "$tool_version" '{repo:{license:$license},plugin:{id:$pluginId,tool_version:$toolVersion}}')"
          echo "json=${json}" >> "$GITHUB_OUTPUT"

      - name: Collect the README payload
        id: variables
        uses: TimSchoenle/actions/actions/common/readme-variables@dc5b395636dc1954383f11af4062a08814e9b15a # tag=actions-common-readme-variables-v2.1.1
        with:
          branch: ${{ github.event.repository.default_branch }}
          extra: ${{ steps.config.outputs.json }}

      - name: Render the README
        uses: TimSchoenle/actions/actions/common/render-template@dc5b395636dc1954383f11af4062a08814e9b15a # tag=actions-common-render-template-v3.0.1
        with:
          template: .github/templates/README.md.hbs
          output: README.md
          variables: ${{ steps.variables.outputs.variables }}

      - name: Create Patch
        id: patch
        uses: TimSchoenle/actions/actions/common/create-patch@dc5b395636dc1954383f11af4062a08814e9b15a # tag=actions-common-create-patch-v1.1.1
        with:
          artifact_name: readme-render
          paths: README.md

      - name: Fail while the render is uncommitted
        if: steps.patch.outputs.has_changes == 'true'
        run: |
          echo "::error::README.md is stale; update-files-commit.yml commits the render and the run on that commit decides."
          exit 1

  # The drift gate. Renders without writing and fails when the committed README.md differs, which is
  # what makes the template the source rather than a suggestion.
  verify:
    name: readme
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read # to read code
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      # The half of the payload readme-variables cannot derive: the plugin id this build registers
      # and the jextract build it defaults to. Both are read straight out of the files that hold
      # them rather than through Gradle, because a build that cannot configure would otherwise
      # leave this step green with an empty payload and surface as a strict-mode error in the
      # render, three steps away from the cause. Each value is its own assignment so `set -e`
      # sees a failure; a `$(...)` inside `echo` would not fail the step.
      - name: Generate the configuration payload
        id: config
        run: |
          set -euo pipefail
          property() { sed -n "s/^$1=//p" gradle.properties | head -n 1; }
          license="$(property license)"
          plugin_id="$(property pluginId)"
          tool_version="$(tr -d "[:space:]" < gradle/jextract-version)"
          json="$(jq -nc --arg license "$license" --arg pluginId "$plugin_id" --arg toolVersion "$tool_version" '{repo:{license:$license},plugin:{id:$pluginId,tool_version:$toolVersion}}')"
          echo "json=${json}" >> "$GITHUB_OUTPUT"

      - name: Collect the README payload
        id: variables
        uses: TimSchoenle/actions/actions/common/readme-variables@dc5b395636dc1954383f11af4062a08814e9b15a # tag=actions-common-readme-variables-v2.1.1
        with:
          branch: ${{ github.event.repository.default_branch }}
          extra: ${{ steps.config.outputs.json }}

      - name: Verify README.md is current
        uses: TimSchoenle/actions/actions/common/render-template@dc5b395636dc1954383f11af4062a08814e9b15a # tag=actions-common-render-template-v3.0.1
        with:
          template: .github/templates/README.md.hbs
          output: README.md
          variables: ${{ steps.variables.outputs.variables }}
          check: 'true'

  # Spotless and OpenRewrite run through ./gradlew, so on a pull request they run that pull
  # request's wrapper, build script and plugins. Code running in a job can read every credential
  # that job holds, so the work is split in two: auto-format runs `rewriteAndFormat` with no secret,
  # no environment and no write permission, and only uploads what it changed as a patch artifact;
  # `commit-format` in update-files-commit.yml mints the App token and commits that patch with
  # common/commit-patch. It runs no repository code: it checks out the head for git's objects only,
  # and commit-patch refuses any path outside allowed_paths.
  auto-format:
    name: Auto-Format
    needs: update-readme
    if: github.event_name == 'pull_request' && needs.update-readme.outputs.changes_detected == 'false'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read # to read code
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit

      # The pull request head, not the merge commit: the patch is committed to the branch, so it has
      # to be computed against the commit the branch points at.
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Auto-Format Code
        id: spotless
        uses: TimSchoenle/actions/actions/java-gradle/auto-spotless@e4229b81c3c3c880b9561dc4d53bd87ccf49eaf3 # tag=actions-java-gradle-auto-spotless-v2.0.1
        with:
          java_version: '25'
          gradle_spotless_command: 'rewriteAndFormat'
          artifact_name: auto-spotless
