name: Cleanup Branch Caches After Deletion
on:
  delete:

# Keyed on the deleted ref, not `github.ref`: on a `delete` event `github.ref` is the default
# branch, so a shared group would let a burst of deletions cancel each other's pending runs and
# leave caches behind.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.ref }}
  cancel-in-progress: false

permissions: {}

jobs:
  cleanup-caches:
    name: Cleanup Caches
    if: github.event.ref_type == 'branch'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: write # to list and delete the caches of the deleted branch
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@aebdcf6156ab6691adf63218240e476564a1ed4c # v2.23.0
        with:
          egress-policy: block
          allowed-endpoints: >
            api.github.com:443

      # `branch` is left empty on purpose: the action then reads the deleted branch from the
      # `delete` payload, and refuses every other event and the default branch.
      - name: Cleanup Caches
        uses: TimSchoenle/actions/actions/maintenance/wipe-cache@54a4dc05fd351a9bf9e9638fa3ebbc572b5f2d7f # tag=actions-maintenance-wipe-cache-v3.1.2
        with:
          token: ${{ github.token }}
